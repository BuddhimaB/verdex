include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "lib/generated/**"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Treat missing required parameters as errors
    missing_required_param: error
    # Treat missing returns as errors
    missing_return: error
    # Treat TODOs as warnings
    todo: warning
    # Treat unused imports as errors
    unused_import: error
    # Treat unused local variables as warnings
    unused_local_variable: warning
    # Dead code
    dead_code: warning
    # Invalid annotations
    invalid_annotation_target: error

linter:
  rules:
    avoid_empty_else: true # Prevent empty else blocks
    avoid_print: true # No print statements in production
    avoid_returning_null_for_future: true # Futures should not return null
    avoid_type_to_string: true # Don't rely on type.toString()
    avoid_types_as_parameter_names: true # Prevent type name conflicts
    cancel_subscriptions: true # Prevent memory leaks
    close_sinks: true # Close streams to prevent leaks
    control_flow_in_finally: true # No return/break in finally blocks
    empty_statements: true # Remove empty statements
    hash_and_equals: true # Override both hashCode and ==
    no_duplicate_case_values: true # Prevent duplicate switch cases
    no_logic_in_create_state: true # Keep createState() clean
    throw_in_finally: true # Don't throw in finally blocks
    unnecessary_statements: true # Remove pointless statements
    unrelated_type_equality_checks: true # Prevent wrong type comparisons
    use_build_context_synchronously: true # Prevent async context issues
    use_key_in_widget_constructors: true # Widget keys for performance
    valid_regexps: true # Validate regex patterns
